/* =========================================================
   НАСТРОЙКИ
   ========================================================= */

const QUESTIONS_PER_QUIZ = 10;


/* =========================================================
   ПЕРЕМЕННЫЕ ИГРЫ
   ========================================================= */

let currentCategory = null;

let questions = [];

let currentQuestion = 0;

let score = 0;

let mistakes = [];

let answered = false;


/* =========================================================
   РАНДОМАЙЗЕР

   Этот алгоритм перемешивает любой массив.

   Он используется и для отдельных тем,
   и для генерального рандома.
   ========================================================= */

function shuffle(array) {

    const result = [...array];

    for (let i = result.length - 1; i > 0; i--) {

        const j =
            Math.floor(Math.random() * (i + 1));

        [result[i], result[j]] =
            [result[j], result[i]];
    }

    return result;
}


/* =========================================================
   ПОЛУЧЕНИЕ ВСЕХ ВОПРОСОВ

   Здесь находится главный принцип генерального рандома.

   Он автоматически проходит по ВСЕМ темам TASKS
   и собирает все вопросы в один массив.

   Поэтому при добавлении нового вопроса в TASKS
   ничего здесь менять не нужно.
   ========================================================= */

function getAllQuestions() {

    let allQuestions = [];

    Object.keys(TASKS).forEach(categoryKey => {

        const category =
            TASKS[categoryKey];

        category.questions.forEach(question => {

            allQuestions.push({

                ...question,

                category:
                    categoryKey,

                categoryTitle:
                    category.title

            });

        });

    });

    return allQuestions;
}


/* =========================================================
   СОЗДАНИЕ ГЛАВНОГО МЕНЮ
   ========================================================= */

function createCategories() {

    const container =
        document.getElementById("categories");

    container.innerHTML = "";


    /* Генеральный рандом */

    const randomButton =
        document.createElement("button");

    randomButton.className =
        "category random-category";

    randomButton.textContent =
        "🎲 Случайная смесь всех тем";

    randomButton.onclick =
        () => startQuiz("random");

    container.appendChild(randomButton);


    /* Обычные темы */

    Object.keys(TASKS).forEach(categoryKey => {

        const button =
            document.createElement("button");

        button.className =
            "category";

        button.textContent =
            TASKS[categoryKey].title;

        button.onclick =
            () => startQuiz(categoryKey);

        container.appendChild(button);

    });

}


/* =========================================================
   НАЧАЛО ТЕСТА
   ========================================================= */

function startQuiz(category) {

    currentCategory =
        category;

    currentQuestion = 0;

    score = 0;

    mistakes = [];


    /* -------------------------
       Обычная тема
       ------------------------- */

    if (category !== "random") {

        const source =
            TASKS[category].questions;

        /*
           Берём вопросы из базы
           и перемешиваем их.
        */

        questions =
            shuffle(source).map(question => ({

                ...question,

                category:
                    category,

                categoryTitle:
                    TASKS[category].title

            }));

    }


    /* -------------------------
       Генеральный рандом
       ------------------------- */

    else {

        /*
           Получаем ВСЕ вопросы
           из всех тем.
        */

        const allQuestions =
            getAllQuestions();


        /*
           Перемешиваем весь массив.

           Если вопросов больше,
           чем нужно для одного теста,
           берём первые QUESTIONS_PER_QUIZ.
        */

        questions =
            shuffle(allQuestions)
                .slice(
                    0,
                    Math.min(
                        QUESTIONS_PER_QUIZ,
                        allQuestions.length
                    )
                );

    }


    /*
       Для обычной темы тоже ограничиваем
       количество вопросов настройкой.

       Если в теме всего 2 вопроса,
       будет 2.
       Если 20 — будет 10.
    */

    if (category !== "random") {

        questions =
            questions.slice(
                0,
                Math.min(
                    QUESTIONS_PER_QUIZ,
                    questions.length
                )
            );

    }


    document.getElementById("home")
        .style.display = "none";

    document.getElementById("result")
        .style.display = "none";

    document.getElementById("quiz")
        .style.display = "block";


    document.getElementById("score")
        .textContent = "0";


    loadQuestion();

}


/* =========================================================
   ЗАГРУЗКА ВОПРОСА
   ========================================================= */

function loadQuestion() {

    answered = false;


    const question =
        questions[currentQuestion];


    document.getElementById("progress")
        .textContent =
            `Вопрос ${currentQuestion + 1} из ${questions.length}`;


    document.getElementById("score")
        .textContent = score;


    document.getElementById("categoryTitle")
        .textContent =
            question.categoryTitle;


    document.getElementById("word")
        .textContent =
            question.text;


    document.getElementById("feedback")
        .innerHTML = "";


    document.getElementById("nextButton")
        .style.display = "none";


    /*
       Кнопки берутся непосредственно
       из текущего вопроса.

       Поэтому здесь может быть:
       О / А
       Е / И
       И / Е
       и любые другие варианты.
    */

    const answersContainer =
        document.getElementById("answers");

    answersContainer.innerHTML = "";


    question.buttons.forEach(buttonText => {

        const button =
            document.createElement("button");

        button.className =
            "answer";

        button.textContent =
            buttonText;

        button.addEventListener(
            "click",
            () => checkAnswer(buttonText)
        );

        answersContainer.appendChild(button);

    });

}


/* =========================================================
   ПРОВЕРКА ОТВЕТА
   ========================================================= */

function checkAnswer(answer) {

    if (answered) return;

    answered = true;


    const question =
        questions[currentQuestion];


    const buttons =
        document.querySelectorAll(".answer");


    buttons.forEach(button => {

        button.disabled = true;


        /*
           Нажатая кнопка
        */

        if (button.textContent === answer) {

            if (answer === question.answer) {

                button.classList.add("correct");

            } else {

                button.classList.add("wrong");

            }

        }


        /*
           Правильная кнопка
        */

        if (button.textContent === question.answer) {

            button.classList.add("correct");

        }

    });


    /* -------------------------
       Правильный ответ
       ------------------------- */

    if (answer === question.answer) {

        score++;


        document.getElementById("feedback")
            .innerHTML = `
                <strong>✓ Правильно!</strong>
                ${question.correct_text}
                <br>
                <small>${question.explanation}</small>
            `;

    }


    /* -------------------------
       Ошибка
       ------------------------- */

    else {

        document.getElementById("feedback")
            .innerHTML = `
                <strong>✗ Неверно</strong>
                Правильный вариант:
                <b>${question.answer}</b>
                <br>
                ${question.correct_text}
                <br>
                <small>${question.explanation}</small>
            `;


        mistakes.push({

            question: question,

            userAnswer: answer

        });

    }


    document.getElementById("score")
        .textContent = score;


    document.getElementById("nextButton")
        .style.display = "inline-block";

}


/* =========================================================
   СЛЕДУЮЩИЙ ВОПРОС
   ========================================================= */

function nextQuestion() {

    currentQuestion++;


    if (currentQuestion >= questions.length) {

        showResult();

        return;

    }


    loadQuestion();

}


/* =========================================================
   РЕЗУЛЬТАТ
   ========================================================= */

function showResult() {

    document.getElementById("quiz")
        .style.display = "none";

    document.getElementById("result")
        .style.display = "block";


    document.getElementById("resultScore")
        .textContent =
            `${score} / ${questions.length}`;


    document.getElementById("resultText")
        .textContent =
            `Правильных ответов: ${score} из ${questions.length}`;


    showMistakes();

}


/* =========================================================
   ОШИБКИ
   ========================================================= */

function showMistakes() {

    const container =
        document.getElementById("mistakes");


    if (mistakes.length === 0) {

        container.innerHTML = `
            <h2>Ошибок нет 🎉</h2>
        `;

        return;

    }


    let html =
        `<h2>Ошибки</h2>`;


    mistakes.forEach(item => {

        html += `

            <div class="mistake">

                <div class="mistake-word">
                    ${item.question.correct_text}
                </div>

                <div class="mistake-answer">
                    Вы выбрали:
                    <b>${item.userAnswer}</b>
                    <br>
                    Правильно:
                    <b>${item.question.answer}</b>
                </div>

                <small>
                    ${item.question.explanation}
                </small>

            </div>

        `;

    });


    container.innerHTML = html;

}


/* =========================================================
   ВЕРНУТЬСЯ НА ГЛАВНУЮ
   ========================================================= */

function goHome() {

    document.getElementById("quiz")
        .style.display = "none";

    document.getElementById("result")
        .style.display = "none";

    document.getElementById("home")
        .style.display = "block";

}


/* =========================================================
   ЗАПУСК
   ========================================================= */

createCategories();


</script>

</body>
</html>
